name: baseline

# Baseline benchmark of UNMODIFIED Paper 26.3 under large entity loads.
# Every matrix job = one full server run + fake player + JFR profiling.
# Reports are committed to reports/baseline/ by the publish job.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baseline.yml'
      - 'baseline/**'
      - 'scripts/**'
      - 'crates/**'
  workflow_dispatch:
    inputs:
      only:
        description: 'comma-separated leg names to run (empty = full matrix). Artifacts only — the publish job is skipped so partial reruns never overwrite committed reports.'
        default: ''
      ce_item_tick:
        description: 'CE_ITEM_TICK for the mod leg (1=on, 0=item pipeline off — bisect knob)'
        default: '1'
      ce_merge:
        description: 'CE_MERGE for the mod leg (1=on, 0=merge fast path off — bisect knob)'
        default: '1'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # ubuntu-26 runner images reclaim long JVM-heavy jobs (three runs lost
      # their big legs to 'runner shutdown'); capping parallel legs also
      # keeps the account-level concurrency spike bounded.
      max-parallel: 6
      matrix:
        include:
          - { name: control,    SCALE: 0,      PCT_ITEMS: 1.0, PCT_STANDS: 0.0, TILE_H: 0,     TILE_F: 0,     MEASURE: 600 }
          - { name: items-25k,  SCALE: 25000,  PCT_ITEMS: 1.0, PCT_STANDS: 0.0, TILE_H: 0,     TILE_F: 0,     MEASURE: 600 }
          - { name: mobs-10k,   SCALE: 10000,  PCT_ITEMS: 0.0, PCT_STANDS: 0.0, TILE_H: 0,     TILE_F: 0,     MEASURE: 600 }
          - { name: mobs-25k,   SCALE: 25000,  PCT_ITEMS: 0.0, PCT_STANDS: 0.0, TILE_H: 0,     TILE_F: 0,     MEASURE: 600, AB: '1' }
          - { name: mixed-50k,  SCALE: 50000,  PCT_ITEMS: 0.7, PCT_STANDS: 0.2, TILE_H: 0,     TILE_F: 0,     MEASURE: 600 }
          - { name: tiles-25k,  SCALE: 0,      PCT_ITEMS: 1.0, PCT_STANDS: 0.0, TILE_H: 15000, TILE_F: 10000, MEASURE: 600 }
          - { name: tiles-100k, SCALE: 0,      PCT_ITEMS: 1.0, PCT_STANDS: 0.0, TILE_H: 60000, TILE_F: 40000, MEASURE: 600 }
          # A/B pairs: vanilla and module runs BACK-TO-BACK ON THE SAME
          # RUNNER. Separate jobs previously landed on different VMs whose
          # CPU speed differs ~15-25% (observed: spread vanilla 472.6 ->
          # 399.4 between two runs) — the single-rep spread/mixed verdicts
          # were runner noise, not module regressions. Paired on one runner,
          # the only variable left is the module.
          - { name: items-100k,  SCALE: 100000, PCT_ITEMS: 1.0, PCT_STANDS: 0.0, TILE_H: 0, TILE_F: 0, MEASURE: 1200, AB: '1' }
          - { name: spread-100k, SCALE: 100000, PCT_ITEMS: 0.6, PCT_STANDS: 0.2, TILE_H: 0, TILE_F: 0, MEASURE: 1200, AREA: 600, AB: '1' }
          - { name: mixed-150k,  SCALE: 150000, PCT_ITEMS: 0.7, PCT_STANDS: 0.2, TILE_H: 0, TILE_F: 0, MEASURE: 1200, AB: '1' }
    env:
      RUN_NAME: ${{ matrix.name }}
      SCALE: ${{ matrix.SCALE }}
      PCT_ITEMS: ${{ matrix.PCT_ITEMS }}
      PCT_STANDS: ${{ matrix.PCT_STANDS }}
      TILE_HOPPERS: ${{ matrix.TILE_H }}
      TILE_FURNACES: ${{ matrix.TILE_F }}
      MEASURE_TICKS: ${{ matrix.MEASURE }}
      AREA: ${{ matrix.AREA || '150' }}
      RUN_TIMEOUT: '1100'
      # 8G + JFR + 100k entities OOM-killed the 16GB runner on the big legs;
      # 5G still died on the new ubuntu-26 images — 4G plus the JFR maxsize
      # cap keeps the JVM footprint well inside the runner budget.
      XMX: '4G'
      MODULE: ${{ matrix.MODULE || 'off' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout CRUSSTY (module scenarios)
        if: matrix.AB == '1' || matrix.MODULE == 'on'
        run: |
          git clone https://github.com/PLANETA9091/CRUSSTY.git ../CRUSSTY
          git -C ../CRUSSTY checkout a34d529  # pinned: the guard-API revision c-entities builds against
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Paper 26.3
        run: bash scripts/fetch-paper.sh 26.3 server/paper.jar
      - name: Build baseline plugin
        run: bash scripts/build-plugin.sh
      - name: Install mineflayer
        run: mkdir -p tools && cd tools && npm install mineflayer --no-save --loglevel=error
      - name: Install ViaVersion (bench bot speaks 26.1; server is 26.3)
        run: |
          mkdir -p build/viaversion
          URL=$(curl -fsS https://hangar.papermc.io/api/v1/projects/ViaVersion/versions | \
            python3 -c '
import json, sys
raw = sys.stdin.read()
d, _ = json.JSONDecoder().raw_decode(raw)
urls = []
for x in d["result"]:
    dl = (x.get("downloads") or {}).get("PAPER") or {}
    u = dl.get("downloadUrl")
    if u:
        urls.append((x.get("name") or "", u))
stable = [u for n, u in urls if "SNAPSHOT" not in n]
print(stable[0] if stable else (urls[0][1] if urls else ""))
')
          [ -n "$URL" ] || { echo "FATAL: no ViaVersion download URL"; exit 1; }
          echo "ViaVersion: $URL"
          curl -fsSL -o build/viaversion/ViaVersion.jar "$URL"
      - name: Run paired A/B (vanilla then module, same runner)
        if: matrix.AB == '1' && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '' || contains(github.event.inputs.only, matrix.name))
        run: |
          bash scripts/run-baseline.sh
          MODULE=on CE_ITEM_TICK=${{ github.event.inputs.ce_item_tick || '1' }} CE_MERGE=${{ github.event.inputs.ce_merge || '1' }} RUN_NAME=${{ matrix.name }}-mod bash scripts/run-baseline.sh
      - name: Run baseline
        if: matrix.AB != '1' && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '' || contains(github.event.inputs.only, matrix.name))
        run: bash scripts/run-baseline.sh
      - name: Upload artifacts (paired A/B leg)
        if: matrix.AB == '1' && always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '' || contains(github.event.inputs.only, matrix.name))
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.name }}
          path: bench/${{ matrix.name }}/results/
          retention-days: 30
          if-no-files-found: error
      - name: Upload artifacts (paired module leg)
        if: matrix.AB == '1' && always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '' || contains(github.event.inputs.only, matrix.name))
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.name }}-mod
          path: bench/${{ matrix.name }}-mod/results/
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  publish:
    needs: run
    # A partial rerun (workflow_dispatch with `only`) must never overwrite
    # the committed full-matrix reports with a subset.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.only == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: baseline-*
          path: bench
      - name: Build summary
        run: python3 scripts/summarize.py bench > BASELINE_SUMMARY.md
      - name: Commit reports
        run: |
          git config user.name "PLANETA9091"
          git config user.email "247359227+PLANETA9091@users.noreply.github.com"
          mkdir -p reports/baseline
          cp BASELINE_SUMMARY.md reports/baseline/SUMMARY.md
          for d in bench/*/; do
            n=$(basename "$d"); n="${n#baseline-}"
            src="$d"
            [ -f "$src/baseline.json" ] || src="$d/results/"
            [ -f "$src/baseline.json" ] || continue
            mkdir -p "reports/baseline/$n"
            cp "$src/REPORT.md" "reports/baseline/$n/" 2>/dev/null || true
            cp "$src/baseline.json" "reports/baseline/$n/" 2>/dev/null || true
            cp "$src/hotspots.md" "reports/baseline/$n/" 2>/dev/null || true
          done
          git add reports/baseline
          git diff --cached --quiet || git commit -m "baseline: results [skip ci]"
          # publish races with other pushes to main (reports commit only);
          # rebase and retry once
          git pull --rebase origin main || git rebase --abort
          git push || (git pull --rebase origin main && git push)

  # ubuntu-26 runners reclaim long JVM-heavy jobs at random ("runner
  # shutdown", exit 143) — the failure rate scales with leg DURATION, which
  # is why exactly the paired A/B legs (2 runs + 2 builds, 40+ min) died
  # three runs in a row while every short leg survived. A runner death kills
  # the whole step, so no in-step retry can help: this job detects the dead
  # legs and redispatches ONLY them (workflow_dispatch `only`), once per
  # push. The redispatched run skips `publish` (partial reruns must never
  # overwrite committed reports) — artifacts are uploaded for forensics.
  rerun:
    needs: run
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Redispatch failed legs
        run: |
          FAILED=$(curl -s -H "Authorization: token ${{ github.token }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" | \
            python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          names=[]
          for j in d.get('jobs',[]):
              if j['conclusion'] not in ('success','skipped',None):
                  n=j['name']
                  if n.startswith('run ('):
                      names.append(n[5:].split(',')[0].strip())
          print(','.join(names))
          ")
          echo "failed legs: $FAILED"
          if [ -n "$FAILED" ]; then
            sleep 30  # let the runner fully release
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token ${{ github.token }}" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/baseline.yml/dispatches" \
              -d "{\"ref\":\"${{ github.sha }}\",\"inputs\":{\"only\":\"$FAILED\"}}")
            echo "dispatch http=$CODE"
          fi
