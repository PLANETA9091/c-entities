name: parity

# Behavioral-equivalence A/B ("honest A/B"): each scenario runs TWICE on the
# same runner — vanilla Paper (MODULE=off) and Paper + c-entities (MODULE=on)
# — under a deterministic-replay regime:
#   * fixed level-seed,
#   * no bench bot (player motion is wallclock-random),
#   * the plugin's spawn layout is seeded (Random(42)) and the fill window
#     starts at a FIXED tick,
#   * Paper's shared entity RNG (Entity.SHARED_RANDOM) is re-seeded to a
#     fixed seed at identical logical points (every fill tick + once at
#     fill-done) in BOTH legs.
# From fill-done the RNG stream free-runs: if the module consumes randomness
# differently than vanilla anywhere (extra draw, different order), or picks
# different goals, or moves entities differently — the divergence compounds
# and the state snapshots stop matching.
# Gate: full entity-state snapshots (positions/yaw/pitch/velocity/health/
# fire/onGround/item fields, bit-exact) at fill-done+50, +300 and at the end
# must be IDENTICAL across the legs. Timings are ignored here — this is the
# "mobs do exactly what Paper's mobs do" proof.

on:
  workflow_dispatch:
    inputs:
      # Diagnostic bisect knobs (defaults = the SHIPPED config; the push
      # parity always runs the shipped config):
      #   item_tick=0: items run the vanilla tick body in the ON leg
      #   mob_ai=0:    mobs run the vanilla serverAiStep in the ON leg
      #   merge=0:     the merge fast path routes vanilla
      # A leg pair that PASSES with a knob off localizes the divergence to
      # that subsystem; the shipped-config gate stays the honest A/B.
      item_tick:
        description: 'CE_ITEM_TICK (1=shipped, 0=vanilla item tick in ON leg)'
        default: '1'
      mob_ai:
        description: 'CE_MOB_AI (1=experimental engine, 0=shipped vanilla AI)'
        default: '0'
      merge:
        description: 'CE_MERGE (1=shipped, 0=vanilla merge in ON leg)'
        default: '1'
      push:
        description: 'CE_PUSH (1=shipped, 0=vanilla pushes via -Dcentities.pushNative=false)'
        default: '1'
      ai_floor:
        description: 'CE_AI_FLOOR (1=experimental engine, 0=shipped vanilla GoalSelector)'
        default: '0'
      collide:
        description: 'CE_COLLIDE (1=shipped, 0=vanilla canCollideWithBukkit body in ON leg)'
        default: '1'
      merge_mirror:
        description: 'CE_MERGE_MIRROR (1=shipped, 0=MH-based isMergable predicate)'
        default: '1'
      trace_id:
        description: 'PARITY_TRACE_ID: per-tick trace of this entity id in BOTH legs (−1 = off)'
        default: '-1'
      ph_dump:
        description: 'PH_DUMP: ticks for per-entity PD dumps (e.g. 140-158; empty = off)'
        default: ''
      extra_jvm:
        description: 'extra JVM flags appended to EXTRA_JVM (e.g. -Dcentities.x=y)'
        default: ''
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'baseline/**'
      - 'scripts/run-baseline.sh'
      - 'scripts/parity-compare.py'
      - '.github/workflows/parity.yml'

permissions:
  contents: read

env:
  PARITY_SEED: '4242'
  FILL_TICKS: '200'
  WARMUP_TICKS: '100'
  MEASURE_TICKS: '600'

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout CRUSSTY (runtime + sdk path deps live at repo-parent)
        run: git clone --depth 1 https://github.com/PLANETA9091/CRUSSTY.git ../CRUSSTY
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch Paper 26.3 (paperclip)
        run: bash scripts/fetch-paper.sh 26.3 server/paper.jar
      - name: Build ce-baseline plugin (parity harness inside)
        run: bash scripts/build-plugin.sh
      - name: Determinism belt — identity hash codes must not depend on addresses
        # -XX:hashCode is experimental on JDK 25: the unlock flag must
        # PRECEDE it (run-baseline.sh appends EXTRA_JVM after the other
        # options, so both travel in one string, unlock first).
        run: |
          BISECT_JVM=""
          if [ "$([ "${{ inputs.push }}" = "0" ] && echo 0 || echo 1)" = "0" ]; then
            BISECT_JVM="$BISECT_JVM -Dcentities.pushNative=false"
          fi
          if [ "$([ "${{ inputs.ai_floor }}" = "0" ] && echo 0 || echo 1)" = "0" ]; then
            BISECT_JVM="$BISECT_JVM -Dcentities.aiFloor=false"
          fi
          EJ="${{ inputs.extra_jvm || '' }}"
          echo "EXTRA_JVM=-XX:+UnlockExperimentalVMOptions -XX:hashCode=5$BISECT_JVM $EJ" >> "$GITHUB_ENV"
          # env-knobs read natively (Rust precompute / CeHooks statics)
          CC="$([ "${{ inputs.collide }}" = "0" ] && echo 0 || echo 1)"
          MM="$([ "${{ inputs.merge_mirror }}" = "0" ] && echo 0 || echo 1)"
          echo "CE_COLLIDE=$CC" >> "$GITHUB_ENV"
          echo "CE_MERGE_MIRROR=$MM" >> "$GITHUB_ENV"

      - name: Paired parity runs (off/on per scenario)
        run: |
          set -euo pipefail
          # NOTE: "0" is FALSY in GitHub expressions (string "0" coerces to
          # number 0) — `inputs.x || '1'` silently turned knob=0 into 1
          # (observed: both bisect runs logged itemTick=1). Compare strings.
          # EMPTY (push trigger) resolves to the INPUT's default, NOT to 1:
          # mob_ai ships OFF (default '0') — the old line armed the
          # experimental engine on every push-triggered parity run, which
          # then NPE'd mid-classification (VH_GS_DISABLED is initialized by
          # the L15 GoalSelector init, absent when aiFloor ships off) and
          # desynced the ON leg from the half-applied mirror tick. The
          # honest shipped-config A/B is engine=0 unless explicitly asked.
          IT="$([ "${{ inputs.item_tick }}" = "0" ] && echo 0 || echo 1)"
          MA="$([ "${{ inputs.mob_ai }}" = "1" ] && echo 1 || echo 0)"
          MG="$([ "${{ inputs.merge }}" = "0" ] && echo 0 || echo 1)"
          TR="${{ inputs.trace_id }}"
          PD="${{ inputs.ph_dump }}"
          echo "bisect knobs: CE_ITEM_TICK=$IT CE_MOB_AI=$MA CE_MERGE=$MG TRACE_ID=$TR PH_DUMP=$PD CE_COLLIDE=${CE_COLLIDE:-1} CE_MERGE_MIRROR=${CE_MERGE_MIRROR:-1}"
          run_leg() { # name scale items stands area module
            echo "=== parity leg $1 (module=$6) ==="
            RUN_NAME="$1" SCALE="$2" PCT_ITEMS="$3" PCT_STANDS="$4" AREA="$5" \
            TILE_HOPPERS=0 TILE_FURNACES=0 \
            FILL_TICKS="$FILL_TICKS" WARMUP_TICKS="$WARMUP_TICKS" MEASURE_TICKS="$MEASURE_TICKS" \
            PARITY=1 PARITY_SEED="$PARITY_SEED" PARITY_TRACE_ID="$TR" PH_DUMP="$PD" \
            MODULE="$6" RUN_TIMEOUT='900' XMX='4G' \
            CE_ITEM_TICK="$IT" CE_MOB_AI="$MA" CE_MERGE="$MG" \
            CE_COLLIDE="${CE_COLLIDE:-1}" CE_MERGE_MIRROR="${CE_MERGE_MIRROR:-1}" \
            bash scripts/run-baseline.sh
          }
          # Scenario set: every entity family the perf benches use, at a
          # scale vanilla holds comfortably (wallclock is irrelevant for the
          # parity state — only the tick sequence matters — but a runner
          # budget still applies).
          #   zombies stroll (AI goals, navigation, look control), items merge
          #   (physics + merge scans), stands are inert markers, spread loads
          #   a wide chunk area.
          run_leg parity-mobs-off   2500 0.0 0.0 150 off
          run_leg parity-mobs-on    2500 0.0 0.0 150 on
          run_leg parity-items-off 20000 1.0 0.0 150 off
          run_leg parity-items-on  20000 1.0 0.0 150 on
          run_leg parity-mixed-off 15000 0.7 0.2 150 off
          run_leg parity-mixed-on  15000 0.7 0.2 150 on
          run_leg parity-spread-off 10000 0.6 0.2 300 off
          run_leg parity-spread-on  10000 0.6 0.2 300 on

      - name: Parity gate — snapshots must be identical across legs
        run: |
          set -euo pipefail
          FAIL=0
          mkdir -p bench/parity-dumps
          for SC in mobs items mixed spread; do
            OFF=bench/parity-$SC-off/results
            ON=bench/parity-$SC-on/results
            # tags: "final" + "T<tick>" snapshots; match by tag — both legs
            # share the fixed fill window, so the tick tags must agree 1:1
            # (|| true: ls under pipefail+set -e exits 2 on no matches, which
            # killed the gate before it could NAME the missing snapshots)
            TAGS=$( { ls "$OFF"/parity-*.json 2>/dev/null || true; } | sed -n 's/.*\/parity-\(.*\)\.json/\1/p' | sort -u)
            TAGS_ON=$( { ls "$ON"/parity-*.json 2>/dev/null || true; } | sed -n 's/.*\/parity-\(.*\)\.json/\1/p' | sort -u)
            if [ -z "$TAGS" ] || [ -z "$TAGS_ON" ]; then
              echo "PARITY-GATE: FAIL — missing snapshots for $SC (off: '$TAGS', on: '$TAGS_ON'); check the legs' server logs for 'PARITY: snapshot failed'"
              ls "$OFF" "$ON" 2>/dev/null || true
              FAIL=1
              continue
            fi
            for TAG in $TAGS; do
              if ! python3 scripts/parity-compare.py "$OFF/parity-$TAG.json" "$ON/parity-$TAG.json" \
                  --dump "bench/parity-dumps/$SC-$TAG.json"; then
                FAIL=1
              fi
            done
          done
          echo "PARITY-A-B-GATE: $([ "$FAIL" = 0 ] && echo PASS || echo FAIL)"
          exit "$FAIL"

      - name: Upload parity divergence dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-dumps
          path: bench/parity-dumps/
          retention-days: 30

      - name: Upload parity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: bench/
          retention-days: 30
