name: e2e

# End-to-end: boot Paper 26.3 under CRUSSTY with the c-entities module,
# assert the full injection chain (patches applied by the JVM, module armed,
# server reaches "Done"). The runtime is built FROM SOURCE — the v2.2.5
# release binary has the non-NUL-terminated hook-name bug (hooks silently
# missed for some classes).

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'module.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout CRUSSTY
        run: |
          git clone https://github.com/PLANETA9091/CRUSSTY.git ../CRUSSTY
          git -C ../CRUSSTY checkout a34d529  # pinned: the guard-API revision c-entities builds against
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch Paper 26.3 (paperclip)
        run: bash scripts/fetch-paper.sh 26.3 /tmp/paper/paperclip.jar
      - name: One-shot paperclip boot (produce mojang-mapped server jar)
        working-directory: /tmp/paper
        run: |
          echo "eula=false" > eula.txt
          timeout 240 java -jar paperclip.jar nogui > boot.log 2>&1 || true
          JAR=$(find versions -name "paper-26.3.jar" | head -1)
          test -f "$JAR"
          echo "PAPER_JAR=$(pwd)/$JAR" >> "$GITHUB_ENV"
      - name: Tests + build module cdylib
        run: |
          cargo test -p centities-module
          cargo build -p centities-module --release
        env:
          PAPER_JAR: ${{ env.PAPER_JAR }}
      - name: Build CRUSSTY runtime from source
        run: cargo build --release -p crussty-runtime
        working-directory: ../CRUSSTY/runtime
      - name: Build ce-baseline plugin (live-traffic asserts)
        run: mvn -q -B -f baseline/plugin/pom.xml package -DskipTests && mkdir -p build && cp baseline/plugin/target/ce-baseline.jar build/
      - name: Stage e2e server directory
        run: |
          mkdir -p e2e/versions e2e/modules/entities e2e/plugins
          cp /tmp/paper/paperclip.jar e2e/versions/paperclip-26.3.jar
          cp target/release/libcentities_module.so e2e/modules/entities/
          cp module.json e2e/modules/entities/
          cp build/ce-baseline.jar e2e/plugins/
          cp ../CRUSSTY/runtime/target/release/libcrussty_runtime.so e2e/
          echo "eula=true" > e2e/eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nview-distance=3\nsimulation-distance=3\nmotd=c-entities e2e\n' > e2e/server.properties
      - name: Boot Paper 26.3 + CRUSSTY + c-entities (with live entities)
        working-directory: e2e
        run: |
          set -o pipefail
          # 55s: boot + module arm; then spawn real entities through the
          # console (probes + queries fire); 100s: soak; stop. The plugin's
          # periodic hooks@ log lines carry the LIVE counters asserted below.
          # Items spawn at FIXED height 50: a falling item runs a merge scan
          # (Level.getEntities(Entity,AABB,Predicate) — the replaced body)
          # every tick of the fall, which guarantees fast-path traffic.
          # Spawning at "~ ~ ~" (console spawn point) is a traffic flake:
          # an item placed ON the ground generates zero queries and the
          # fast>0 assert fails without any module defect (observed 2026-10-19).
          # sleep 90: on cold runners the paperclip boot (extract + remap +
          # patch) can exceed 60s — console commands sent before "Done" die
          # with "Incorrect argument" and the item traffic silently vanishes
          # (observed 2026-10-22: three green e2e runs with ZERO item traffic;
          # local poll-Done boot: summons at T+50s work, Done at 32.6s).
          # 26.3 syntax (console-verified 2026-10-23): `execute in <dim>` on
          # the console rejects the position argument, so plain `summon`
          # (default dimension = overworld) is used; entity NBT keys are
          # snake_case since 1.21.5 (no_ai / persistence_required / marker),
          # while the item stack key stays Item:{id:...,count:1}.
          (sleep 90;
           echo "summon minecraft:zombie 8 -59 8 {no_ai:1b,persistence_required:1b}";
           echo "summon minecraft:armor_stand 10 -59 10 {marker:1b,gravity:0b}";
           sleep 2;
           echo 'summon minecraft:item 0 50 0 {Item:{id:"minecraft:stone",count:1},PickupDelay:32767}';
           sleep 6;
           echo 'summon minecraft:item 4 55 4 {Item:{id:"minecraft:dirt",count:1},PickupDelay:32767}';
           sleep 3;
           echo "summon minecraft:zombie -8 -59 -8 {no_ai:1b,persistence_required:1b}";
           sleep 50;
           echo "summon minecraft:zombie 16 -59 16 {no_ai:1b,persistence_required:1b}";
           sleep 50; echo stop) | timeout 280 \
            java -Xms1G -Xmx4G \
            "-agentpath:$PWD/libcrussty_runtime.so=modules=$PWD/modules;versions=$PWD/versions;kernel=paperclip-26.3.jar" \
            -jar versions/paperclip-26.3.jar --nogui > e2e.log 2>&1 || true
          echo "## e2e markers" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "pipeline ready|\[c-entities\]|hooks@|Done \(|crussty-runtime. retransform" e2e.log | head -50 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -5 e2e.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Assert injection chain + LIVE hook counters
        working-directory: e2e
        run: |
          fail() { echo "E2E ASSERT FAILED: $1"; grep -E "\[c-entities\]|hooks@|pipeline ready|Done \(" e2e.log | head -40; exit 1; }
          grep -q  "pipeline ready: 1 module hook(s)"        e2e.log || fail "module pipeline not ready"
          grep -q  "\[c-entities\] natives registered"        e2e.log || fail "natives not registered"
          grep -q  "\[c-entities\] patched Level.getEntities" e2e.log || fail "Level.getEntities not patched"
          grep -q  "\[c-entities\] patched Entity box probe + wake-on-impulse" e2e.log || fail "Entity box probe not patched"
          grep -q  "\[c-entities\] patched EntityLookup"      e2e.log || fail "EntityLookup probes not patched"
          grep -q  "\[c-entities\] precomputed ServerLevel dispatch guard" e2e.log || fail "L7 dispatch guard not precomputed"
          grep -q  "\[c-entities\] patched ServerLevel tickNonPassenger dispatch guard" e2e.log || fail "L7 dispatch guard not applied"
          grep -q  "\[c-entities\] patched LivingEntity pushEntities dispatch guard" e2e.log || fail "L12 push dispatch guard not applied"
          grep -q  "\[c-entities\] ARMED"                     e2e.log || fail "module not armed"
          grep -q  "Done ("                                   e2e.log || fail "server did not finish boot"
          ! grep -q "NOT armed"                               e2e.log || fail "module reported NOT armed"
          ! grep -q "FAILED to patch"                         e2e.log || fail "a patch FAILED (vanilla kept)"
          ! grep -q "VerifyError"                             e2e.log || fail "a class failed verification"
          # LIVE traffic: the last hooks@ line must show real probe and fast-path
          # activity (summoned entities moved/queried). This is the assertion
          # that catches a silently-inert module (wrong class object armed,
          # probes dead) — log-marker asserts above CANNOT see that.
          LAST_HOOKS=$(grep "hooks@" e2e.log | tail -1)
          echo "last hooks: $LAST_HOOKS"
          echo "$LAST_HOOKS" | grep -q "active=true"           || fail "kill switch is OFF (module disarmed)"
          echo "$LAST_HOOKS" | grep -Eq "add=[1-9]"            || fail "probeAdd never fired (EntityLookup probe dead)"
          echo "$LAST_HOOKS" | grep -Eq "box=[1-9]"            || fail "probeBox never fired (Entity probe dead)"
          # Liveness: the query fast path served traffic OR the merge fast
          # path did (falling items drive mergeScanNative) OR the L7
          # dispatch owned real item ticks (disp=checks/NATIVE/...). One 45s
          # retry covers a slow first soak window; the items now spawn with
          # 26.3 item NBT (count:1) so the traffic is deterministic.
          LIVE=0
          echo "$LAST_HOOKS" | grep -Eq "fast=[1-9]" && LIVE=1
          echo "$LAST_HOOKS" | grep -Eq "merge=[0-9]+/[0-9]+/[1-9]" && LIVE=1
          echo "$LAST_HOOKS" | grep -Eq "disp=[0-9]+/[1-9]" && LIVE=1
          if [ "$LIVE" != "1" ]; then
            sleep 45
            LAST_HOOKS=$(grep "hooks@" e2e.log | tail -1)
            echo "retry hooks: $LAST_HOOKS"
            echo "$LAST_HOOKS" | grep -Eq "fast=[1-9]" && LIVE=1
            echo "$LAST_HOOKS" | grep -Eq "merge=[0-9]+/[0-9]+/[1-9]" && LIVE=1
          fi
          [ "$LIVE" = "1" ] || fail "no woven fast path served a query"
          echo "$LAST_HOOKS" | grep -Eq "desync=0 "            || fail "index desynced from the world"
          # doc 21: the fast path must RESOLVE its candidates — the ids the
          # native returns have to map back to ARENA/live entities. The
          # byte-order bug (direct BB defaulted to BIG_ENDIAN over little-
          # endian native stores) slid through every assert above: every id
          # read back as 0, resolved=0, and desync stayed 0 (stale>0 reads
          # as the "normal batching window"). cand=N/M with M=0 while N>0
          # is that failure shape — assert the resolve ratio for any real
          # candidate traffic (the tiny e2e world gives N ~ tens).
          SEEN=$(echo "$LAST_HOOKS" | sed -nE 's/.*cand=([0-9]+)\/([0-9]+).*/\1/p')
          RES=$(echo "$LAST_HOOKS" | sed -nE 's/.*cand=([0-9]+)\/([0-9]+).*/\2/p')
          echo "cand seen=$SEEN resolved=$RES"
          if [ -n "$SEEN" ] && [ "$SEEN" -ge 8 ]; then
            [ -n "$RES" ] && [ "$RES" -ge $((SEEN / 2)) ] || fail "fast path returns UNRESOLVABLE ids (cand=$SEEN/$RES)"
          fi
          echo "E2E OK: module armed, patches applied, probes + fast path LIVE (add/box/fast counters > 0)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-log
          path: e2e/e2e.log
          retention-days: 14
