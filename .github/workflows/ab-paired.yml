name: ab-paired

# 4a.3 — paired same-runner A/B. Previous runs placed the on/off pair on
# DIFFERENT runners (up to +-30% job-to-job spread), so a delta could not
# prove "never slower than vanilla". This workflow runs each off/on pair
# BACK TO BACK on the SAME runner, repeated, and gates on the medians.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SCENARIOS: items-100k mobs-25k mixed-150k spread-100k mobs-despawn-10k
  REPEATS: '3'
  MEASURE: '400'
  GATE_MARGIN: '1.05'

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Checkout CRUSSTY (runtime + sdk path deps live at repo-parent)
        run: git clone --depth 1 https://github.com/PLANETA9091/CRUSSTY.git ../CRUSSTY
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Paper 26.3 (paperclip)
        run: bash scripts/fetch-paper.sh 26.3 server/paper.jar
      - name: Build ce-baseline plugin
        run: bash scripts/build-plugin.sh
      - name: Install mineflayer
        run: mkdir -p tools && cd tools && npm install mineflayer minecraft-data@3.117.0 --no-save --loglevel=error
      - name: Install ViaVersion + ViaBackwards (bench bot speaks 26.1; ViaBackwards is REQUIRED — ViaVersion alone refuses old clients, which is why every 26.3 run so far was playerless)
        run: |
          mkdir -p build/viaversion
          fetch() {
            curl -fsS "https://hangar.papermc.io/api/v1/projects/$1/versions" | \
            python3 -c "import json,sys;raw=sys.stdin.read();d,_=json.JSONDecoder().raw_decode(raw);u=[(x.get('name') or '', (x.get('downloads') or {}).get('PAPER',{}).get('downloadUrl') or '') for x in d.get('result',[])];u=[t for t in u if t[1]];s=[x[1] for x in u if 'SNAPSHOT' not in x[0]];print(s[0] if s else (u[0][1] if u else ''))" || echo ""
          }
          VV=$(fetch ViaVersion);   [ -n "$VV" ] || { echo "FATAL: no ViaVersion URL";   exit 1; }
          VB=$(fetch ViaBackwards); [ -n "$VB" ] || { echo "FATAL: no ViaBackwards URL"; exit 1; }
          echo "ViaVersion: $VV"; echo "ViaBackwards: $VB"
          curl -fsSL -o build/viaversion/ViaVersion.jar "$VV"
          curl -fsSL -o build/viaversion/ViaBackwards.jar "$VB"

      - name: Paired off/on runs
        run: |
          # items-100k runs 3 paired reps (the contested gate after 4b.2a's
          # single-sample 1.057 vs margin 1.05 — profiles proved the module
          # tax there is ~0.2ms/tick, so the delta read as noise). The L179
          # addendum lesson: single-rep vanilla denominators swing +-35%
          # run-to-run (spread off 485.7 -> 361.7, despawn off 98.6 -> 62.7
          # between the fb6919a and f542062 flights, the ON medians stable),
          # so the contested -90% rows (spread-100k, mobs-despawn-10k) also
          # carry 3 paired reps — the gate medians de-noise the denominator.
          # The gate reads REPEATS=3 but tolerates missing samples.
          for SC in $SCENARIOS; do
            case "$SC" in
              items-100k)  SCALE=100000; ITEMS=1.0; STANDS=0.0; AREA=0; REPS=3; DESP=0; MOBW=0;;
              mobs-25k)    SCALE=25000;  ITEMS=0.0; STANDS=0.0; AREA=0; REPS=1; DESP=0; MOBW=0;;
              # N3-N1 phase-2c (doc 61b): the honest gate — non-persistent
              # zombies (removeWhenFarAway=true) spread over +-350 blocks:
              # the far ring (outside the hard 128) despawns in both arms,
              # the soft band (32..128) rolls on noAction>600 — the OFF arm
              # through vanilla checkDespawn, the ON arm through the native
              # decision; the populations MUST converge (the samples' entity
              # column carries the curve, the gate asserts the end delta).
              mobs-despawn-10k) SCALE=10000; ITEMS=0.0; STANDS=0.0; AREA=700; REPS=3; DESP=1; MOBW=1;;
              # N2-M2e alignment (the baseline.yml production rows): the
              # spread/mixed zombie fractions ride the native wire — the
              # vanilla-AI zombie fraction made the ab-paired ON legs pay the
              # vanilla mob floor the production rows never do (the
              # baseline-matrix spread-mod 47..64ms vs this gate's 299..328ms
              # era). The honest production ratio needs the production config.
              mixed-150k)  SCALE=150000; ITEMS=0.7; STANDS=0.2; AREA=0; REPS=1; DESP=0; MOBW=1;;
              spread-100k) SCALE=100000; ITEMS=0.6; STANDS=0.2; AREA=600; REPS=3; DESP=0; MOBW=1;;
            esac
            # mixed-150k on a 2-vCPU runner: fill ~18m + warmup ~9m
            # (about 5.7 s/tick observed) — a 600-tick window does not
            # fit the budget; 300 ticks keep the gate meaningful.
            MEAS="$MEASURE"
            if [ "$SC" = "mixed-150k" ]; then MEAS='300'; fi
            # the soft band's noAction>600 gate needs >600 live ticks before
            # the 1/800 rolls start firing inside the measure window
            if [ "$SC" = "mobs-despawn-10k" ]; then MEAS='600'; fi
            for r in $(seq 1 "$REPS"); do
            for ARM in off on; do
                if [ "$ARM" = "on" ]; then
                  M='on'
                else
                  M='off'
                fi
                echo "=== pair r$r $SC arm=$ARM ==="
                RUN_NAME="abp-r$r-$SC-$ARM" \
                SCALE="$SCALE" PCT_ITEMS="$ITEMS" PCT_STANDS="$STANDS" \
                AREA="$AREA" DESPAWN="${DESP:-0}" CE_NATIVE_MOB="${MOBW:-0}" TILE_HOPPERS=0 TILE_FURNACES=0 \
                MEASURE_TICKS="$MEAS" RUN_TIMEOUT='1800' XMX='8G' \
                MODULE="$M" \
                bash scripts/run-baseline.sh
                if [ "$M" = "on" ]; then
                  LOG="bench/abp-r$r-$SC-on/results/server.log"
                  grep -q "ARMED" "$LOG" || { echo "FATAL: not armed (r$r $SC)"; exit 1; }
                  # a mid-run disarm (active=false) means the leg measured a
                  # vanilla-plus-probe-tax world — the first kernel round
                  # lost every leg to a boot-phase NPE this way
                  grep "hooks@" "$LOG" | tail -1 | grep -q "active=true" || { echo "FATAL: module DISARMED mid-run (r$r $SC)"; grep "hooks@" "$LOG" | tail -1; exit 1; }
                  if grep -q "NOT armed" "$LOG"; then echo "FATAL: NOT armed (r$r $SC)"; exit 1; fi
                  if grep -q "FAILED to patch" "$LOG"; then echo "FATAL: patch failed (r$r $SC)"; exit 1; fi
                  grep -q "desync=0" <(grep "hooks@" "$LOG" | tail -1) || { echo "FATAL: desync (r$r $SC)"; grep "hooks@" "$LOG" | tail -1; exit 1; }
                fi
              done
            done
          done

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-paired-results
          path: bench/
          retention-days: 30

      - name: Gate — paired medians, module must not be slower than vanilla
        run: |
          python3 - <<'PY'
          import json, glob, statistics, sys, os, re
          margin = float(os.environ.get("GATE_MARGIN", "1.05"))
          scen = os.environ["SCENARIOS"].split()
          reps = int(os.environ["REPEATS"])

          DESP_SCEN = {"mobs-despawn-10k"}
          POP_TOL = 0.05  # the surviving-population delta the gate tolerates
                          # (the arms run the IDENTICAL spawn layout — rnd
                          # seed 42 — the populations must converge)

          def load(arm, sc):
              out = []
              for r in range(1, reps + 1):
                  p = f"bench/abp-r{r}-{sc}-{arm}/results/baseline.json"
                  try:
                      out.append(json.load(open(p))["mspt"]["mean"])
                  except Exception:
                      pass
              return out

          def last_pop(arm, sc):
              # the last MSPT sample's entity count — the despawn
              # curve's end state (the surviving strata). The sample
              # rows are dicts since the L37-era harness ({tick,
              # entities, hoppers, ...}); the old list rows [t, n,
              # ...] keep the index read as the fallback.
              vals = []
              for r in range(1, reps + 1):
                  p = f"bench/abp-r{r}-{sc}-{arm}/results/baseline.json"
                  try:
                      d = json.load(open(p))
                      s = d.get("samples") or []
                      if s:
                          last = s[-1]
                          vals.append(last["entities"] if isinstance(last, dict)
                                      else last[1])
                  except Exception:
                      pass
              return vals

          rows, fails = [], []
          # L185 gate hardening: an ON leg whose server log carries an
          # init-failure lastErr= means the module's fast-path
          # infrastructure collapsed — the parity gate stays green (the
          # fallback IS the vanilla shape) and the ab-paired verdicts stay
          # PASS (never-slower-than-vanilla in-pair), but the ratios
          # explode: the L183 flight read items ON 22.44 -> 53.63 and
          # mixed 69.94 -> 171.51 behind a PASS verdict because a
          # java.base reflection threw inside initTrackerLoopHandles and
          # killed the tracker-handle init. The referee grades HEALTH:
          # any init* failure text in an ON leg's server log fails the
          # gate outright.
          initfails = {}
          for sc in scen:
              for r in range(1, reps + 1):
                  p = f"bench/abp-r{r}-{sc}-on/results/latest.log"
                  try:
                      txt = open(p, errors="ignore").read()
                  except Exception:
                      continue
                  for m in re.finditer(r"lastErr=(init\S*)", txt):
                      initfails.setdefault(f"{sc}/r{r}", m.group(1))
          for k, v in sorted(initfails.items()):
              print(f"ON-INIT-FAIL {k}: {v}")
          if initfails:
              fails.append("on-init")

          for sc in scen:
              off, on = load("off", sc), load("on", sc)
              if not off or not on:
                  fails.append(sc)
                  rows.append((sc, off, on, None))
                  continue
              mo, mn = statistics.median(off), statistics.median(on)
              ratio = mn / mo if mo > 0 else float("inf")
              ok = ratio <= margin
              popline = ""
              if sc in DESP_SCEN:
                  po, pn = last_pop("off", sc), last_pop("on", sc)
                  if po and pn:
                      delta = abs(statistics.median(po) - statistics.median(pn))
                      base = max(statistics.median(po), 1.0)
                      pok = delta / base <= POP_TOL
                      popline = f"  pop off={statistics.median(po):.0f} on={statistics.median(pn):.0f} delta={delta:.0f} {'OK' if pok else 'POP-FAIL'}"
                      if not pok:
                          ok = False
                  else:
                      ok = False
                      popline = "  pop MISSING"
              if not ok:
                  fails.append(sc)
              rows.append((sc, off, on, (mo, mn, ratio, ok, popline)))
          print("scenario      off-samples            on-samples             med-off  med-on   ratio  verdict")
          for sc, off, on, res in rows:
              if res is None:
                  print(f"{sc:<14}{str(off):<24}{str(on):<24}{'-':>9}{'-':>9}{'-':>7}  FAIL(missing)")
                  continue
              mo, mn, ratio, ok, popline = res
              print(f"{sc:<14}{str([round(x,1) for x in off]):<24}{str([round(x,1) for x in on]):<24}{mo:>9.2f}{mn:>9.2f}{ratio:>7.3f}  {'PASS' if ok else 'FAIL'}{popline}")
          print()
          print("AB-PAIRED-GATE: " + ("PASS" if not fails else "FAIL: " + ",".join(fails)))
          sys.exit(1 if fails else 0)
          PY
        env:
          SCENARIOS: items-100k mobs-25k mixed-150k spread-100k mobs-despawn-10k
          REPEATS: '3'
          GATE_MARGIN: '1.05'
