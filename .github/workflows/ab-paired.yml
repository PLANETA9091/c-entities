name: ab-paired

# 4a.3 — paired same-runner A/B. Previous runs placed the on/off pair on
# DIFFERENT runners (up to +-30% job-to-job spread), so a delta could not
# prove "never slower than vanilla". This workflow runs each off/on pair
# BACK TO BACK on the SAME runner, repeated, and gates on the medians.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SCENARIOS: items-100k mobs-25k mixed-150k spread-100k
  REPEATS: '3'
  MEASURE: '400'
  GATE_MARGIN: '1.05'

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Checkout CRUSSTY (runtime + sdk path deps live at repo-parent)
        run: git clone --depth 1 https://github.com/PLANETA9091/CRUSSTY.git ../CRUSSTY
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Paper 26.3 (paperclip)
        run: bash scripts/fetch-paper.sh 26.3 server/paper.jar
      - name: Build ce-baseline plugin
        run: bash scripts/build-plugin.sh
      - name: Install mineflayer
        run: mkdir -p tools && cd tools && npm install mineflayer minecraft-data@3.117.0 --no-save --loglevel=error
      - name: Install ViaVersion + ViaBackwards (bench bot speaks 26.1; ViaBackwards is REQUIRED — ViaVersion alone refuses old clients, which is why every 26.3 run so far was playerless)
        run: |
          mkdir -p build/viaversion
          fetch() {
            curl -fsS "https://hangar.papermc.io/api/v1/projects/$1/versions" | \
            python3 -c "import json,sys;raw=sys.stdin.read();d,_=json.JSONDecoder().raw_decode(raw);u=[(x.get('name') or '', (x.get('downloads') or {}).get('PAPER',{}).get('downloadUrl') or '') for x in d.get('result',[])];u=[t for t in u if t[1]];s=[x[1] for x in u if 'SNAPSHOT' not in x[0]];print(s[0] if s else (u[0][1] if u else ''))" || echo ""
          }
          VV=$(fetch ViaVersion);   [ -n "$VV" ] || { echo "FATAL: no ViaVersion URL";   exit 1; }
          VB=$(fetch ViaBackwards); [ -n "$VB" ] || { echo "FATAL: no ViaBackwards URL"; exit 1; }
          echo "ViaVersion: $VV"; echo "ViaBackwards: $VB"
          curl -fsSL -o build/viaversion/ViaVersion.jar "$VV"
          curl -fsSL -o build/viaversion/ViaBackwards.jar "$VB"

      - name: Paired off/on runs
        run: |
          # items-100k runs 3 paired reps (the contested gate after 4b.2a's
          # single-sample 1.057 vs margin 1.05 — profiles proved the module
          # tax there is ~0.2ms/tick, so the delta read as noise); mixed and
          # spread keep 1 rep (decided: 0.823 / 0.999). The gate reads
          # REPEATS=3 but tolerates missing samples per scenario.
          for SC in $SCENARIOS; do
            case "$SC" in
              items-100k)  SCALE=100000; ITEMS=1.0; STANDS=0.0; AREA=0; REPS=3;;
              mobs-25k)    SCALE=25000;  ITEMS=0.0; STANDS=0.0; AREA=0; REPS=1;;
              mixed-150k)  SCALE=150000; ITEMS=0.7; STANDS=0.2; AREA=0; REPS=1;;
              spread-100k) SCALE=100000; ITEMS=0.6; STANDS=0.2; AREA=600; REPS=1;;
            esac
            # mixed-150k on a 2-vCPU runner: fill ~18m + warmup ~9m
            # (about 5.7 s/tick observed) — a 600-tick window does not
            # fit the budget; 300 ticks keep the gate meaningful.
            MEAS="$MEASURE"
            if [ "$SC" = "mixed-150k" ]; then MEAS='300'; fi
            for r in $(seq 1 "$REPS"); do
            for ARM in off on; do
                if [ "$ARM" = "on" ]; then
                  M='on'
                else
                  M='off'
                fi
                echo "=== pair r$r $SC arm=$ARM ==="
                RUN_NAME="abp-r$r-$SC-$ARM" \
                SCALE="$SCALE" PCT_ITEMS="$ITEMS" PCT_STANDS="$STANDS" \
                AREA="$AREA" TILE_HOPPERS=0 TILE_FURNACES=0 \
                MEASURE_TICKS="$MEAS" RUN_TIMEOUT='1800' XMX='8G' \
                MODULE="$M" \
                bash scripts/run-baseline.sh
                if [ "$M" = "on" ]; then
                  LOG="bench/abp-r$r-$SC-on/results/server.log"
                  grep -q "ARMED" "$LOG" || { echo "FATAL: not armed (r$r $SC)"; exit 1; }
                  if grep -q "NOT armed" "$LOG"; then echo "FATAL: NOT armed (r$r $SC)"; exit 1; fi
                  if grep -q "FAILED to patch" "$LOG"; then echo "FATAL: patch failed (r$r $SC)"; exit 1; fi
                  grep -q "desync=0" <(grep "hooks@" "$LOG" | tail -1) || { echo "FATAL: desync (r$r $SC)"; grep "hooks@" "$LOG" | tail -1; exit 1; }
                fi
              done
            done
          done

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-paired-results
          path: bench/
          retention-days: 30

      - name: Gate — paired medians, module must not be slower than vanilla
        run: |
          python3 - <<'PY'
          import json, glob, statistics, sys, os
          margin = float(os.environ.get("GATE_MARGIN", "1.05"))
          scen = os.environ["SCENARIOS"].split()
          reps = int(os.environ["REPEATS"])

          def load(arm, sc):
              out = []
              for r in range(1, reps + 1):
                  p = f"bench/abp-r{r}-{sc}-{arm}/results/baseline.json"
                  try:
                      out.append(json.load(open(p))["mspt"]["mean"])
                  except Exception:
                      pass
              return out

          rows, fails = [], []
          for sc in scen:
              off, on = load("off", sc), load("on", sc)
              if not off or not on:
                  fails.append(sc)
                  rows.append((sc, off, on, None))
                  continue
              mo, mn = statistics.median(off), statistics.median(on)
              ratio = mn / mo if mo > 0 else float("inf")
              ok = ratio <= margin
              if not ok:
                  fails.append(sc)
              rows.append((sc, off, on, (mo, mn, ratio, ok)))
          print("scenario      off-samples            on-samples             med-off  med-on   ratio  verdict")
          for sc, off, on, res in rows:
              if res is None:
                  print(f"{sc:<14}{str(off):<24}{str(on):<24}{'-':>9}{'-':>9}{'-':>7}  FAIL(missing)")
                  continue
              mo, mn, ratio, ok = res
              print(f"{sc:<14}{str([round(x,1) for x in off]):<24}{str([round(x,1) for x in on]):<24}{mo:>9.2f}{mn:>9.2f}{ratio:>7.3f}  {'PASS' if ok else 'FAIL'}")
          print()
          print("AB-PAIRED-GATE: " + ("PASS" if not fails else "FAIL: " + ",".join(fails)))
          sys.exit(1 if fails else 0)
          PY
        env:
          SCENARIOS: items-100k mobs-25k mixed-150k spread-100k
          REPEATS: '3'
          GATE_MARGIN: '1.05'
